# imprint development container — environment lives in the image; the repo is
# a host bind (host is source of truth). No AI-tool credentials are mounted:
# install/auth opencode, gh etc. inside the container when needed. Root's home
# (/root — auth, configs, history) is a named volume, so it survives container
# recreation AND destroy; only an explicit volume deletion loses it.
# Container is NOT removed on stop (no --rm; use docker/dev.sh destroy only
# when you mean to delete the container — the /root volume stays).
name: imprint-dev

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: imprint-dev:latest
    container_name: imprint-dev
    hostname: imprint-dev
    # long-lived; settings made inside the container persist until destroy
    init: true
    command: ["sleep", "infinity"]
    working_dir: /workspace/imprint
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /tmp/.docker.xauth
      # optional: pass through if set on the host (auth later inside container)
      GH_TOKEN: "${GH_TOKEN:-}"
      TERM: "${TERM:-xterm-256color}"
    volumes:
      # --- display (host X share) ---
      # snap Docker has a private /tmp: the /tmp/.X11-unix bind stays empty.
      # network_mode: host is what actually reaches X (abstract socket).
      - "${XAUTHORITY_FILE:-/dev/null}:/tmp/.docker.xauth:ro"
      # --- repo (bind: host is source of truth) ---
      - ..:/workspace/imprint:rw
      # --- sibling repo: fps demo consumes imprint as an external runtime ---
      # (absolute via $HOME on purpose: relative binds resolve against the
      # compose file's dir, and ../fps silently pointed inside the imprint repo)
      # Optional: without a host ~/workspace/fps, compose would create an
      # empty root-owned directory in its place, so the bind is added only
      # when the directory exists (IMPRINT_DEV_WITH_FPS=1 also forces it).
      - ${IMPRINT_DEV_FPS_BIND:-/dev/null}:/workspace/fps:rw
      # --- persistent state (runtime user is root) ---
      # opencode/gh/dsh auth, tool configs, bash history, ~/.local/bin
      # installs. Named volume: initialized once from the image's /root, then
      # owned by it — survives `destroy`, deleted only by
      # `docker volume rm imprint-dev-home`.
      - dev-home:/root
    stdin_open: true
    tty: true
    # Electron/AppImage sandboxes do not work in an ordinary container
    security_opt:
      - seccomp:unconfined
    # shares host net ns → libX11 connects via @/tmp/.X11-unix/X0
    network_mode: host

volumes:
  dev-home:
    name: imprint-dev-home
